version: '3.8'

services:
  backend:
    build:
      context: ./src/backend
      dockerfile: Dockerfile
    container_name: backend
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - MONGODB_URI=mongodb://mongodb:27017/gate_management
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=your_jwt_secret_key
      # Thêm các biến môi trường khác của backend tại đây
    depends_on:
      - mongodb
      - redis
    networks:
      - app-network
    restart: always

  frontend:
    build:
      context: ./src/frontend
      dockerfile: Dockerfile
    container_name: frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://your_runpod_ip:4000/api
      - NEXT_PUBLIC_CV_URL=http://your_runpod_ip:5001
    depends_on:
      - backend
    networks:
      - app-network
    restart: always

  computer-vision:
    build:
      context: ./src/computer-vison
      dockerfile: Dockerfile
    container_name: computer-vision
    ports:
      - "5001:5001"
    environment:
      - FLASK_PORT=5001
      - FLASK_HOST=0.0.0.0
      - BACKEND_URL=http://backend:4000/api/scan
      - CAMERA_INDEX=0 # Có thể đổi thành URL RTSP camera của bạn
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - app-network
    restart: always

  mongodb:
    image: mongo:latest
    container_name: mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - app-network
    restart: always

  redis:
    image: redis:alpine
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - app-network
    restart: always

networks:
  app-network:
    driver: bridge

volumes:
  mongodb_data:
  redis_data:
