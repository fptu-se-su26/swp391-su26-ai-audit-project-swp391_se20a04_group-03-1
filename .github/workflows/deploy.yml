name: CI/CD Pipeline for Logiport

on:
  push:
    branches:
      - main # Hoặc đổi thành branch chính của bạn (ví dụ: master, feat/...)

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # --- 1. BUILD & PUSH BACKEND ---
      - name: Build and Push Backend
        uses: docker/build-push-action@v4
        with:
          context: ./src/backend # Trỏ đúng vào thư mục backend trong monorepo
          file: ./src/backend/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/logiport-backend:latest

      # --- 2. BUILD & PUSH FRONTEND ---
      - name: Build and Push Frontend
        uses: docker/build-push-action@v4
        with:
          context: ./src/frontend # Trỏ đúng vào thư mục frontend trong monorepo
          file: ./src/frontend/Dockerfile
          push: true
          # Ép các tham số biến môi trường HTTPS cứng lúc build như các bước trước
          build-args: |
            NEXT_PUBLIC_API_URL=https://api.datnotes.click/api
            NEXT_PUBLIC_CV_URL=https://<id-may-chu-runpod>-5001.proxy.runpod.net
          tags: ${{ secrets.DOCKER_USERNAME }}/logiport-frontend:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push # Chờ build xong xuôi mới tiến hành deploy

    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            # Di chuyển vào thư mục chứa file docker-compose.yml trên VPS của bạn
            cd /home/ubuntu/logiport

            # Tải các bản image mới nhất vừa được GitHub push lên Docker Hub về
            docker compose pull

            # Khởi động lại các container mà không làm gián đoạn hệ thống
            docker compose up -d --force-recreate

            # Dọn dẹp các bản image cũ (dạng <none>) để tránh đầy bộ nhớ VPS
            docker image prune -f
