name: Mobile OTA update (EAS)

# Mỗi lần push vào main mà có thay đổi trong app mobile -> đẩy bản cập nhật JS
# (over-the-air) tới các APK đã cài, không cần build/cài lại.
#
# YÊU CẦU trước khi workflow này chạy được:
#   1. Đã chạy `eas update:configure` trong src/frontend_mobile-expo và commit
#      app.json (có projectId + updates.url + runtimeVersion).
#   2. Đã thêm secret repo EXPO_TOKEN (token truy cập Expo, tạo ở
#      https://expo.dev/accounts/[account]/settings/access-tokens).
#   3. Đã thêm secret repo EXPO_PUBLIC_API_URL = URL backend công khai mà điện
#      thoại truy cập được (KHÔNG dùng localhost). Biến EXPO_PUBLIC_* được nhúng
#      vào bundle lúc build bản update, nên phải có ở đây.
#
# LƯU Ý: OTA chỉ đẩy được thay đổi JS/asset. Thay đổi native (thêm thư viện
# native, đổi quyền, nâng SDK) phải build APK mới.

on:
  push:
    branches: [main]
    paths:
      - "src/frontend_mobile-expo/**"
      - ".github/workflows/mobile-eas-update.yml"

jobs:
  update:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend_mobile-expo
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: src/frontend_mobile-expo/package-lock.json

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Publish OTA update
        env:
          EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL }}
        run: eas update --channel production --message "${{ github.event.head_commit.message }}" --non-interactive
